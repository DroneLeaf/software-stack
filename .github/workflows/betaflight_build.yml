# Targets: MICOAIR743V2 (MicoAir743 V2), MICOAIR743 (MicoAir743),
#          KAKUTEH7V2 (Holybro Kakute H7 V2), SITL
#
# Betaflight builds for a software-stack release. The build itself is maintained
# in the betaflight repository: its reusable workflow
# DroneLeaf/betaflight/.github/workflows/droneleaf-fc-build.yml (branch
# dev-sitl), which developers can also run by hand there. This file keeps what
# software-stack decides:
# - when: releases named '*betaflight*' (flightcontrollers_dispatcher.yml), or
#   Run workflow here (files as artifacts only);
# - which commit: the one this repository's betaflight submodule is pinned to,
#   so bump that pointer to publish new flight-controller builds;
# - which targets: the matrix below;
# - where the files go: this repository's release (release_tag).
#
# Each target yields droneleaf_<version>_<MCU>_<target>_<commit>.hex, or
# droneleaf_<version>_SITL_<commit>.elf for SITL (smoke-tested for 8 s by the
# called workflow). The .hex files can be flashed with the Betaflight App
# (Firmware Flasher tab -> "Load Firmware [Local]"); the build server used by
# "Load Firmware [Online]" only serves builds of the upstream betaflight
# repository.
name: Build Betaflight Firmware

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      release_name:
        required: false
        type: string

permissions:
  contents: write   # the called build attaches its files to this repository's release

jobs:
  pin:
    # Called by flightcontrollers_dispatcher.yml for releases named '*betaflight*'.
    # NOTE: inside a called workflow github.event_name is the *caller's* event and
    # never 'workflow_call', so the release path is keyed off inputs instead.
    if: github.event_name == 'workflow_dispatch' || inputs.release_name == '' || contains(inputs.release_name, 'betaflight')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the betaflight submodule pin
        id: pin
        run: |
          commit=$(git rev-parse HEAD:betaflight)
          echo "betaflight is pinned to $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        target:
          - MICOAIR743V2
          - MICOAIR743
          - KAKUTEH7V2
          - SITL
    # No secrets are passed: the betaflight repository is public, and the
    # release upload uses this run's GITHUB_TOKEN (contents: write above).
    uses: DroneLeaf/betaflight/.github/workflows/droneleaf-fc-build.yml@dev-sitl
    with:
      commit: ${{ needs.pin.outputs.commit }}
      board: ${{ matrix.target }}
      release_tag: ${{ inputs.release_tag }}
