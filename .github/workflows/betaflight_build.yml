# Builds the DroneLeaf Betaflight firmware from the betaflight submodule pinned by this
# repository, so bump that pointer to publish new flight-controller builds. Boards and
# build options live in betaflight/droneleaf/build-firmware.sh, shared with the fork's
# own "DroneLeaf Firmware Release" workflow.
#
# Called by flightcontrollers_dispatcher.yml for releases named '*racer*' or '*betaflight*'.
#
# The .hex files can be flashed with the Betaflight App (Firmware Flasher tab ->
# "Load Firmware [Local]"); the build server used by "Load Firmware [Online]"
# only serves builds of the upstream betaflight repository.
name: Build Betaflight Firmware

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      release_name:
        required: false
        type: string

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: true

      - name: Get build targets
        id: get-targets
        run: echo "targets=$(./betaflight/droneleaf/build-firmware.sh targets)" >> "$GITHUB_OUTPUT"

      - name: Release info
        run: |
          {
            echo '### Betaflight firmware'
            echo '```'
            ./betaflight/droneleaf/build-firmware.sh release-info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    needs: setup
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: betaflight # --> every run step executes inside: $GITHUB_WORKSPACE/betaflight

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive

      - name: Cache build toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: betaflight/tools
          key: ${{ runner.os }}-betaflight-${{ hashFiles('betaflight/mk/tools.mk') }}

      - name: Install ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      # Output: droneleaf_<version>_STM32H743_<target>_<revision>.hex
      - name: Build firmware
        run: ./droneleaf/build-firmware.sh build ${{ matrix.target }}

      - name: Package firmware files
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release_files
          cp betaflight/obj/droneleaf_*_${{ matrix.target }}_*.hex release_files/
          ls -al release_files

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-build-output-${{ matrix.target }}
          path: release_files/*.hex
          if-no-files-found: error

      - name: Upload firmware to existing release
        if: inputs.release_tag != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # A dev release may already be deleted by its own cleanup job; that must not fail this build.
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::warning::Release '${RELEASE_TAG}' no longer exists; skipping firmware upload"
            exit 0
          fi
          gh release upload "${RELEASE_TAG}" release_files/*.hex --repo "${GITHUB_REPOSITORY}" --clobber

  ##########################################################
  # SITL binds port 5761 for UART1
  # SITL will output to IP 127.0.0.1:9002 (Gazebo)
  # SITL will output to IP 127.0.0.1:9001 (RealFlightBridge)
  ##########################################################
  sitl:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: betaflight # --> every run step executes inside: $GITHUB_WORKSPACE/betaflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive

      - name: Build SITL
        run: ./droneleaf/build-firmware.sh build SITL

      - name: Smoke-test SITL
        run: ./droneleaf/build-firmware.sh smoke-sitl "$(ls obj/droneleaf_*_SITL)"

      - name: Upload SITL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitl.log.zip
          path: betaflight/sitl.log

      # Binary name carries the firmware version, so it is matched by glob.
      - name: Package SITL binary
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release_files
          SITL_BIN="$(ls betaflight/obj/droneleaf_*_SITL)"
          cp "${SITL_BIN}" "release_files/$(basename "${SITL_BIN}").elf"
          ls -al release_files

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-build-output-SITL
          path: release_files/*.elf
          if-no-files-found: error

      - name: Upload SITL to existing release
        if: inputs.release_tag != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # A dev release may already be deleted by its own cleanup job; that must not fail this build.
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::warning::Release '${RELEASE_TAG}' no longer exists; skipping firmware upload"
            exit 0
          fi
          gh release upload "${RELEASE_TAG}" release_files/*.elf --repo "${GITHUB_REPOSITORY}" --clobber
