# Version: 2026.6.0-alpha
# MCU Family: STM32F7X2
# Target: SKYSTARSF7HDPRO
name: Build Betaflight Firmware

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      release_name:
        required: false
        type: string

permissions:
  contents: write

jobs:
  firmware:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'racer') || contains(inputs.release_name, 'racer')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: betaflight # --> every run step executes inside: $GITHUB_WORKSPACE/betaflight

    strategy:
      matrix:
        target:
          - SKYSTARSF7HDPRO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodules
        run: git submodule update --init --recursive
        working-directory: .

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl clang python3 python3-pip

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Prepare configs
        run: make configs

      - name: Clean build
        run: make clean || true

      - name: Build firmware
        run: make ${{ matrix.target }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-${{ matrix.target }}.hex.zip
          path: betaflight/obj/betaflight_*_${{ matrix.target }}.hex

      - name: Attach firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: betaflight/obj/betaflight_*_${{ matrix.target }}.hex
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

  sitl:
    needs: [firmware]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'racer') || contains(inputs.release_name, 'racer')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: betaflight # --> every run step executes inside: $GITHUB_WORKSPACE/betaflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodules
        run: git submodule update --init --recursive
        working-directory: .

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl clang python3 python3-pip

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Clean build
        run: make clean TARGET=SITL || true

      - name: Build SITL
        run: make TARGET=SITL

      - name: Upload SITL artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-SITL.zip
          path: betaflight/obj/betaflight_2026.6.0-alpha_SITL

      - name: rename before publishing to release assets
        run: cp ./obj/betaflight_2026.6.0-alpha_SITL ./obj/betaflight_2026.6.0-alpha_SITL.elf

      - name: Attach SITL to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: betaflight/obj/betaflight_2026.6.0-alpha_SITL.elf
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

  ##########################################################        
  # SITL binds port 5761 for UART1
  # SITL will output to IP 127.0.0.1:9002 (Gazebo)
  # SITL will output to IP 127.0.0.1:9001 (RealFlightBridge)
  ##########################################################
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'racer') || contains(inputs.release_name, 'racer')
    runs-on: ubuntu-latest
    needs: sitl

    defaults:
      run:
        working-directory: betaflight # --> every run step executes inside: $GITHUB_WORKSPACE/betaflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Download SITL artifact
        uses: actions/download-artifact@v4
        with:
          name: betaflight-SITL.zip
          path: betaflight/obj/

      - name: Set executable permissions on SITL binary
        run: chmod +x ./obj/betaflight_2026.6.0-alpha_SITL

      - name: Run SITL and capture output
        run: |
          set -e
          timeout 8s ./obj/betaflight_2026.6.0-alpha_SITL > sitl.log || true # --> $GITHUB_WORKSPACE/betaflight/sitl.log

      - name: Checking for crash
        run: |
          if grep -iE "segmentation fault|core dumped|panic|fatal" sitl.log; then
            echo "Crash detected"
            cat sitl.log
            exit 1
          fi

      - name: Validate normal startup output
        run: |
          grep -qE "SITL|Betaflight" sitl.log || (echo "Missing expected output" && cat sitl.log && exit 1)

      - name: Upload SITL logs
        uses: actions/upload-artifact@v4
        with:
          name: sitl.log.zip
          path: betaflight/sitl.log
          