name: PX4-Autopilot Build

on:
  release:
    types: [created]
  workflow_dispatch:  # Also allow manual triggering

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: px4io/px4-dev-nuttx-focal:latest
      options: --privileged
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.TOKEN }}
        
    # Step 1: Resolve the source branch for the release tag and get PX4 URL
    - name: Resolve release source branch & PX4 URL
      id: resolve_branch
      shell: bash
      run: |
        set -euo pipefail

        # Fix "dubious ownership" in Actions workspace
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        # Ensure refs are available
        git fetch --tags origin
        git fetch origin '+refs/heads/*:refs/remotes/origin/*'

        # Determine tag name (for release workflows)
        if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        else
          TAG_NAME="${GITHUB_REF_NAME:-}"
        fi
        if [[ -z "${TAG_NAME}" ]]; then
          echo "Could not resolve tag name." >&2
          exit 1
        fi

        TAG_SHA="$(git rev-list -n 1 "${TAG_NAME}")"

        # Find a branch in *this repo* that contains the tag commit
        mapfile -t CONTAINERS < <(git branch -r --contains "${TAG_SHA}" \
                                  | sed -n 's#^[[:space:]]*origin/##p' \
                                  | grep -v '^HEAD$' || true)

        SOURCE_BRANCH=""
        for CAND in main master develop release dev "${CONTAINERS[@]}"; do
          if git rev-parse --verify -q "refs/remotes/origin/${CAND}" >/dev/null; then
            if git merge-base --is-ancestor "${TAG_SHA}" "refs/remotes/origin/${CAND}"; then
              SOURCE_BRANCH="${CAND}"
              break
            fi
          fi
        done

        if [[ -z "${SOURCE_BRANCH}" ]]; then
          echo "No branch found that contains tag ${TAG_NAME} (${TAG_SHA})." >&2
          exit 1
        fi

        # Map PX4 branch exceptions: dev->leaf-dev, main->leaf-main, else same
        case "${SOURCE_BRANCH}" in
          dev)   PX4_BRANCH="leaf-dev" ;;
          main)  PX4_BRANCH="leaf-main" ;;
          *)     PX4_BRANCH="${SOURCE_BRANCH}" ;;
        esac

        PX4_URL="$(git config --file .gitmodules --get submodule.PX4-Autopilot.url || true)"
        if [[ -z "${PX4_URL}" ]]; then
          echo "PX4 submodule URL not found in .gitmodules." >&2
          exit 1
        fi

        echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "px4_branch=${PX4_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "px4_url=${PX4_URL}" >> "$GITHUB_OUTPUT"

    # Step 2: Clone PX4-Autopilot on the mapped branch — fail if missing
    - name: Checkout PX4-Autopilot on mapped branch (no fallback)
      shell: bash
      env:
        TOKEN: ${{ secrets.TOKEN }}
      run: |
        set -euo pipefail

        SRC_BRANCH="${{ steps.resolve_branch.outputs.source_branch }}"
        PX4_BRANCH="${{ steps.resolve_branch.outputs.px4_branch }}"
        RAW_URL="${{ steps.resolve_branch.outputs.px4_url }}"

        echo "Source branch: ${SRC_BRANCH}"
        echo "PX4 branch (mapped): ${PX4_BRANCH}"

        # Normalize to HTTPS and inject token
        HTTPS_BASE="$(echo "${RAW_URL}" \
          | sed -E 's#^git@github.com:#https://github.com/#; s#^ssh://git@github.com/#+https://github.com/#; s#\.git$##')"
        AUTH_URL="https://${TOKEN}@${HTTPS_BASE#https://}"

        # Require the branch to exist in PX4 repo
        if ! git ls-remote --heads "${AUTH_URL}.git" "${PX4_BRANCH}" | grep -q .; then
          echo "Required branch '${PX4_BRANCH}' does not exist in PX4 repo: ${HTTPS_BASE}" >&2
          exit 1
        fi

        rm -rf PX4-Autopilot
        git clone -b "${PX4_BRANCH}" --single-branch "${AUTH_URL}.git" PX4-Autopilot
        cd PX4-Autopilot
        git submodule update --init --recursive

    
    - name: Build PX4 for SITL
      working-directory: ./PX4-Autopilot
      run: |
        make px4_sitl_default
    
    - name: Build PX4 for additional targets
      working-directory: ./PX4-Autopilot
      run: |
        # Uncomment and modify these lines to build for specific hardware targets
        # make px4_fmu-v5_default
        make px4_fmu-v6x_default
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: px4-build-output
        path: |
          ./PX4-Autopilot/build/px4_sitl_default
          ./PX4-Autopilot/build/px4_fmu-v6x_default
          # Add additional build outputs if you uncommented other targets
    
    - name: Create release tag
      id: tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        TAG_NAME="px4-build-${BRANCH_NAME}-${TIMESTAMP}"
        echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
        git tag $TAG_NAME
        git push origin $TAG_NAME
    
    - name: Package firmware files
      run: |
        mkdir -p release_files
        cp ./PX4-Autopilot/build/px4_fmu-v6x_default/px4_fmu-v6x_default.px4 release_files/ || true
        cp ./PX4-Autopilot/build/px4_sitl_default/bin/px4 release_files/px4_sitl || true
    
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release_files/*
        tag_name: ${{ steps.tag.outputs.tag }}
        name: PX4 Stable Release ${{ steps.tag.outputs.tag }}
        body: |
          Stable PX4 Firmware Release
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
        
    - name: Upload firmware to existing release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release_files/*
        tag_name: ${{ steps.release_info.outputs.tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}