# LEAF_FC for Debian trixie (Raspberry Pi OS) - ROS 2 Jazzy.
#
# Debian-trixie sibling of leaf_fc_ros2.yml, same shape: HEAR_Docker's
# Dockerfile.unified owns the environment and the build; this only drives it,
# extracts the artifacts, and hands them to UPM to package/sign/publish.
# Trixie is selected with a single build arg: BASE_IMAGE=debian:trixie.


name: LEAF_FC RPi OS (Debian trixie, ROS2 Jazzy) Build and Deploy

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: "HEAR_Msgs/HEAR_FC branch - must be a ROS 2 branch"
        required: false
        default: "dev"
      base_image:
        description: "Override the Debian base image (empty uses TRIXIE_BASE_IMAGE)"
        required: false
        default: ""
      ros2_apt_url:
        description: "Override the ROS 2 APT repo (e.g. a DroneLeaf mirror)"
        required: false
        default: ""

permissions:
  contents: write

env:
  SOURCE_DIR: ${{ github.workspace }}/HEAR_Docker
  WS_NAME: HEAR_FC
  IMAGE_USERNAME: hashim
  # Set repository variable LEAF_FC_FORCE_DEPS_REFRESH to "true" for a cold dependency rebuild.
  FORCE_DEPS_REFRESH: ${{ vars.LEAF_FC_FORCE_DEPS_REFRESH }}
  # ------------------------------------------------------------------------
  # TRIXIE_BASE_IMAGE: Pinned to a specific SHA256 digest for reproducible builds.
  #
  # Why use a SHA256 digest instead of a tag (e.g., "debian:trixie")?
  #   - Tags are mutable: "debian:trixie" can point to a different image over time
  #     as Debian releases security updates and point releases (by the original maintainer).
  #   - A SHA256 digest is immutable: it always resolves to the exact same image
  #     layers, guaranteeing bit-for-bit reproducibility.
  #
  # How this avoids unwanted cache invalidations:
  #   - Docker layer caching keys off the base image digest. If the base image
  #     changes (even with the same tag), all downstream layers are invalidated,
  #     forcing a full rebuild of base/ros2/deps layers.
  #   - By pinning to a digest, the base image layer remains constant across
  #     workflow runs. Cached layers for ROS 2 installation, system dependencies,
  #     and workspace setup remain valid until we explicitly bump this digest.
  #
  # When to bump:
  #   - Update the TRIXIE_BASE_IMAGE repository variable when you want to pull in
  #     Debian security updates, new package versions, or ROS 2 dependency updates.
  #   - Do NOT bump automatically; treat it as a deliberate version pin.
  # ------------------------------------------------------------------------
  # The repository variable wins. What after || is used only when the variable is
  # missing or empty, so a deleted variable cannot leave the Docker FROM blank.
  # keep this digest equal to the variable whenever you bump it.
  TRIXIE_BASE_IMAGE: ${{ vars.TRIXIE_BASE_IMAGE || 'debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.release.name, 'ros2') && contains(github.event.release.name, 'rpi_os') && !contains(github.ref_name, 'dev'))
    runs-on: Linux_ARM64_16core

    strategy:
      matrix:
        include:
          - target: RPI
            target_lower: rpi

    permissions:
      id-token: write
      contents: read
      packages: write
      actions: write

    # the deploy job needs the calculated package version from the build job
    # so that we have to expose it as a job-output
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Read the version from the release tag
        id: version
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_PATTERN='^(v|release-|rel-)?([0-9]+\.[0-9]+\.[0-9]+)([._+-][A-Za-z].*)?$'
          # examples:
          #   v1.2.3
          #   release-1.2.3
          #   rel-1.2.3
          #   1.2.3
          #   v1.2.3-alpha
          #   release-1.2.3_beta
          #   1.2.3+build123
          #   v1.2.3.rc1
          if [[ ! "$TAG_NAME" =~ $TAG_PATTERN ]]; then
            echo "::error::Release tag '$TAG_NAME' is not a valid X.Y.Z version tag"
            exit 1
          fi

          # Now we need to retrive the second capture group (the version number X.Y.Z)
          # by stripping any v,release-,rel- prefix and any suffix
          # and that can be done by ${BASH_REMATCH[N]}
          VERSION="${BASH_REMATCH[2]}"

          echo "✅ Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Clone HEAR_Docker repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          rm -rf HEAR_Docker
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_Docker.git" HEAR_Docker \
            || { echo "❌ Failed to clone HEAR_Docker repository"; exit 1; }

      - name: Preflight — leaf-* trixie suite must be published
        run: |
          if curl -fsS "https://apt.droneleaf.io/dists/trixie/Release" >/dev/null 2>&1; then
            echo "✅ apt.droneleaf.io serves a trixie suite."
          else
            echo "::error::apt.droneleaf.io has NO trixie suite. Publish the leaf-* trixie twins first (see define_trixie.md)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      # we will employ GHCR to store the built Docker image layers caching
      # so we have to authenticate oursleves here first.
      - name: Login to GHCR (registry layer cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LEAF_FC ROS2 Jazzy for Debian trixie
        id: build-using-docker
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          triggering_actor: ${{ github.triggering_actor }}
          TOKEN: ${{ secrets.TOKEN }}
          target_lower: ${{ matrix.target_lower }}
          docker_builder: trixieBuilder
          build_platform: linux/arm64
          CACHE_REF: ghcr.io/droneleaf/software-stack:leaf-fc-rpi-os-deps-cache
        run: |
          set -e
          # RANDOM_NUM busts app layers; FORCE_DEPS_REFRESH can also even rebuild from earlier Dockerfile stages (base/ros2/deps).
          export BUILD_TIMESTAMP=$(date +%s)

          if [[ "$FORCE_DEPS_REFRESH" == "true" ]]; then
            echo "Forcing fresh base, ros2, and deps stages; skipping GHCR cache import."
            BUILD_CACHE_ARGS=(--no-cache-filter base --no-cache-filter ros2 --no-cache-filter deps)
          else
            BUILD_CACHE_ARGS=(--cache-from "type=registry,ref=$CACHE_REF")
          fi

          docker buildx create --name "$docker_builder" --driver=docker-container --use \
            || docker buildx use "$docker_builder"

          # The artifacts target runs the trixie checks, then exports only what gets packaged.
          # The Dockerfile copies files under /$WS_NAME, creating another $WS_NAME folder inside this export directory.
          # Example for rpi: $GITHUB_WORKSPACE/upm_extracted_files_ros2_trixie_rpi/HEAR_FC
          EXPORT_DIR="${GITHUB_WORKSPACE}/upm_extracted_files_ros2_trixie_${target_lower}/${WS_NAME}"

          # +------- Building using Dockerfile.unified (located in HEAR_FC repository) -------+
          # Notes:
          # - The build option --target builds only up to the `artifacts` stage in `Dockerfile.unified`. It holds nothing except the files we copy
          #   into it which are:
          #      - install/
          #      - the 3 FC XML files.
          #      - /verified marker.
          # - instead of the old way (--load) which takes the finished image and loads it into the runner local Docker daemon
          #   which based on the build logs it causes extra ~6 min we will use a new way (--target/--output) which writes files straight
          #   into a folder on the runner. No image is created and nothing is loaded.
          # - since we are using the (--target/--output) way, there is no need to `docker create` or `docker cp` anymore.
          # - `EXPORT_DIR` is `upm_extracted_files_ros2_trixie_rpi/HEAR_FC`. The artifact upload then uploads that folder.
          #    Then the workflow downloads and finds the workspace at `artifacts/HEAR_FC/HEAR_FC`. That matches the old path, so UPM still works unchanged.
          # - For debugging: since no image to inspect after a run. If we want to debug the container, we have to build it locally or with another target.
          # - Build directory files are gone. The exported folder has only what gets packaged, so build/, log/ and other source are no longer uploaded.
          #   This was intended, and it is also why the artifact is smaller.
          docker buildx build . \
            --builder="$docker_builder" \
            --platform "$build_platform" \
            --file Dockerfile.unified \
            "${BUILD_CACHE_ARGS[@]}" \
            --target artifacts \
            --output "type=local,dest=$EXPORT_DIR" \
            --secret id=GITHUB_ID,env=triggering_actor \
            --secret id=GITHUB_TOKEN,env=TOKEN \
            --build-arg BASE_IMAGE="${{ inputs.base_image || env.TRIXIE_BASE_IMAGE }}" \
            --build-arg ROS2_APT_URL="${{ inputs.ros2_apt_url }}" \
            --build-arg TARGET="${{ matrix.target }}" \
            --build-arg TARGET_RPI=ON \
            --build-arg USERNAME="${IMAGE_USERNAME}" \
            --build-arg WS_NAME="${WS_NAME}" \
            --build-arg IS_PRODUCTION="TRUE" \
            --build-arg COMPILE_BRANCH="${{ github.event.release.target_commitish || inputs.branch || 'dev' }}" \
            --build-arg RANDOM_NUM="$BUILD_TIMESTAMP"

          docker buildx ls


      # pass the built workspace from the build job to the deploy job
      - name: Upload UPM workspace as artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}
          path: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}
          if-no-files-found: error
          # Kept for 1 day only: the deploy job downloads it minutes later, and the build output should not stay downloadable.
          retention-days: 1
          # A re-run of a failed job uploads this name again, so replace it instead of failing.
          overwrite: true

      - name: Compress the install directory tree as TARBALL
        id: create-tarball
        if: github.event_name == 'release'
        continue-on-error: true
        # The tarball is not critical, but a hang here would hold the whole job.
        timeout-minutes: 15
        env:
          target_lower: ${{ matrix.target_lower }}
        run: |
          # EXPORT_DIR ends with $WS_NAME, and the Docker output adds another /$WS_NAME for the workspace.
          # Example for rpi: upm_extracted_files_ros2_trixie_rpi/HEAR_FC/HEAR_FC
          WORKSPACE_DIR="upm_extracted_files_ros2_trixie_${target_lower}/${WS_NAME}/${WS_NAME}"

          TARBALL="leaf_fc_rpi_os_${target_lower}.tar.gz"
          
          # use pigz as a default compressor, fallback to gzip if it's not available.
          COMPRESSOR=gzip
          if command -v pigz >/dev/null 2>&1; then
            COMPRESSOR=pigz
          fi
          
          echo "Compressing with $COMPRESSOR"
          tar --use-compress-program="$COMPRESSOR" -cf "$TARBALL" -C "$WORKSPACE_DIR" ./install

          # verification:
          # No pipe here: without pipefail it would hide a broken tarball.
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/tarball_files.txt"
          head -n 10 "$RUNNER_TEMP/tarball_files.txt"

      - name: Attach the TARBALL to the release
        id: attach-tarball
        # continue-on-error makes success() true even when the tarball failed, so check the real outcome.
        # On manual runs the tarball step is skipped, so this step is skipped too.
        if: steps.create-tarball.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: leaf_fc_rpi_os_${{ matrix.target_lower }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Warn that there is no tarball
        if: steps.create-tarball.outcome == 'failure'
        run: echo "::warning::The tarball was not created, so the release has no tarball attached"

      # +------- Docker Layers Caching To GHCR -------+
      # - Rebuild the Dockerfile only through its `deps` stage then uploading these reusable Docker layers to the shared GHCR cache.
      # - The layers are cached to `ghcr.io/droneleaf/software-stack:leaf-fc-rpi-os-deps-cache`
      # - Why through `deps` stage only? Because only base, ros2 and deps are worth caching, the later layers change every release.
      # - Note: The build args must match the build above, or the cache keys differ and everything will be built again from scratch.
      - name: Refresh the dependency cache
        id: refresh-deps-cache
        if: inputs.base_image == '' && inputs.ros2_apt_url == ''   # skip refreshing the shared cache when we customize either input.
        continue-on-error: true # continue-on-error does not cover a hang.
        timeout-minutes: 15
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          docker_builder: trixieBuilder
          build_platform: linux/arm64
          CACHE_REF: ghcr.io/droneleaf/software-stack:leaf-fc-rpi-os-deps-cache
        run: |
          set -e
          if [[ "$FORCE_DEPS_REFRESH" == "true" ]]; then
            echo "Exporting the freshly built dependency stages without importing the old GHCR cache."
            CACHE_IMPORT_ARGS=()
          else
            CACHE_IMPORT_ARGS=(--cache-from "type=registry,ref=$CACHE_REF")
          fi
          docker buildx build . \
            --builder="$docker_builder" \
            --platform "$build_platform" \
            --file Dockerfile.unified \
            --target deps \
            "${CACHE_IMPORT_ARGS[@]}" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --build-arg BASE_IMAGE="$TRIXIE_BASE_IMAGE" \
            --build-arg ROS2_APT_URL="" \
            --build-arg USERNAME="$IMAGE_USERNAME"

  deploy:
    needs: [build]
    # Release events only: manual runs build and never publish.
    # The release name (title) should include both patterns 'ros2' and 'rpi_os' regardless the ordering.
    # The branch name (tag) shouldn't include the pattern 'dev'
    if: github.event_name == 'release' && contains(github.event.release.name, 'ros2') && contains(github.event.release.name, 'rpi_os') && !contains(github.ref_name, 'dev')
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - target: RPI
            target_lower: rpi
            target_upm_package_name: leaf_fc_ros2_trixie
            target_upm_publish_name: leaf-fc-ros2
            target_upm_profile: rpi_release
            target_upm_profile_upper: RPI-Release
            target_distribution: trixie
            REPO_NAME: HEAR_FC

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via aws IAM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get VERSION from the build job
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::The build job gave no version, refusing to deploy"
            exit 1
          fi
          echo "✅ Version: $RELEASE_VERSION"
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download the UPM workspace artifact
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}
          path: ./artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloads
        id: verify-artifact
        run: |
          test -d ./artifacts || { echo "::error::no artifacts downloaded"; exit 1; }
          ls -la ./artifacts/

          # UPM does not fail on missing files, it would publish an empty package.
          WORKSPACE_DIR="./artifacts/${WS_NAME}/${WS_NAME}"
          for binary in px4_mav_opti_flight_controller_onboard_mission betaflight_racer; do
            if ! ls "$WORKSPACE_DIR"/install/*/lib/flight_controller/"$binary"; then
              echo "::error::$binary is missing from the downloaded workspace"
              exit 1
            fi
          done
          if ! ls "$WORKSPACE_DIR"/install/*/share/flight_controller/launch/launch/*.py; then
            echo "::error::launch files are missing from the downloaded workspace"
            exit 1
          fi
          if ! ls "$WORKSPACE_DIR"/src/HEAR_FC/Flight_controller/*.xml; then
            echo "::error::XML files are missing from the downloaded workspace"
            exit 1
          fi

      - name: Setup GPG for package signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gnupg2
          fi
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret not found"; exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2 | head -1)
          echo -e "5\ny\n" | gpg --batch --command-fd 0 --expert --edit-key "$GPG_KEY_ID" trust
          git config --global user.signingkey "$GPG_KEY_ID"
          git config --global commit.gpgsign false
          echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --armor --detach-sig --sign >/dev/null
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$HOME/.gnupg" >> "$GITHUB_ENV"

      - name: Clone HEAR_Docker repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_Docker.git" HEAR_Docker \
            || { echo "❌ Failed to clone HEAR_Docker"; exit 1; }

      - name: Clone HEAR_CLI repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_CLI.git" HEAR_CLI \
            || { echo "❌ Failed to clone HEAR_CLI"; exit 1; }

      - name: UPM package + deploy (trixie suite)
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPO_NAME: ${{ matrix.REPO_NAME }}
          registry_username: ${{ secrets.registry_username }}
          registry_password: ${{ secrets.registry_password }}
        run: |
          set -e
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/UPM.git" UPM \
            || { echo "❌ Failed to clone UPM"; exit 1; }
          cd UPM
          [ -f upm.yaml ] || { echo "::error::upm.yaml not found"; exit 1; }

          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          PKG="${{ matrix.target_upm_package_name }}"
          if [ "$(yq eval ".packages.${PKG} // \"null\"" upm.yaml)" = "null" ]; then
            echo "::error::upm.yaml has no '${PKG}' (see define_trixie.md)."
            exit 1
          fi

          WORKSPACE_PATH="/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/artifacts/$REPO_NAME/$REPO_NAME"
          [ -d "$WORKSPACE_PATH" ] || {
            echo "::error::Workspace not found: $WORKSPACE_PATH"
            ls -la "$(dirname "$WORKSPACE_PATH")" || true
            exit 1
          }

          cp upm.yaml upm.yaml.backup
          yq eval ".packages.${PKG}.build.workspace = \"$WORKSPACE_PATH\"" -i upm.yaml
          yq eval ".packages.${PKG}.version = \"$VERSION\"" -i upm.yaml
          if [ "$(yq eval ".packages.${PKG}.build.workspace" upm.yaml)" != "$WORKSPACE_PATH" ]; then
            echo "::error::upm.yaml workspace update failed"; mv upm.yaml.backup upm.yaml; exit 1
          fi

          sed -i "s|/home/medo/projects/HEAR_CLI|/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/HEAR_CLI|g" upm.yaml
          sed -i "s|/home/medo/HEAR_Docker|/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/HEAR_Docker|g" upm.yaml

          cd upm && pip install -r requirements.txt && cd ..

          GPG_TTY=$(tty) ./upm_cli package "$PKG" ${{ matrix.target_upm_profile }} deb

          # Derive the .deb name from name_template: the trixie twin carries a -trixie- infix.
          STEM=$(yq eval ".packages.${PKG}.packaging.name_template" upm.yaml | sed 's/-\?{version}.*//')
          DEB_NAME="${STEM}-${VERSION}-${{ matrix.target_upm_profile_upper }}.deb"
          if [ ! -f "dist/${DEB_NAME}" ]; then
            echo "::error::dist/${DEB_NAME} not found after packaging. Present:"; ls -la dist/ || true; exit 1
          fi

          GPG_TTY=$(tty) ./upm_cli deploy "$PKG" "dist/${DEB_NAME}" leaf_apt_repo

          PACKAGE_ABSOLUTE_PATH=$(find "$(pwd)" -name "$DEB_NAME" | head -1)
          test -n "$PACKAGE_ABSOLUTE_PATH" || { echo "::error::built .deb not found"; exit 1; }
          echo "DEB_PATH=$PACKAGE_ABSOLUTE_PATH" >> "$GITHUB_ENV"

          # +----- Publish to repo.droneleaf.io -----+
          # --fail-with-body: an HTTP error (401, 403, 500) must fail the step.
          # No -v: it would print the Authorization header into the public log.
          curl --fail-with-body -sS --connect-timeout 30 --max-time 1800 \
            -u "${registry_username}:${registry_password}" \
            -H "Content-Type: multipart/form-data" \
            --data-binary "@${PACKAGE_ABSOLUTE_PATH}" \
            http://18.158.175.125:80/repository/apt-trixie/ -H "Host: repo.droneleaf.io"

      - name: Upload the .deb as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf_fc_rpi_os_${{ matrix.target_lower }}_deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error
          retention-days: 1
          # Kept for 1 day only: the package is published to apt anyway.
          # A re-run of a failed job uploads this name again, so replace it instead of failing.
          overwrite: true

  # ========================================================================================
  # Dev build/deploy — mirrors leaf_fc_ros2.yml's build-dev/deploy-dev, but for the
  # trixie twin. Deliberately requires BOTH 'ros2' and 'rpi_os' in the release name
  # (matching this file's stable jobs of 'leaf-fc-ros2') so it stays mutually exclusive with
  # leaf_fc_ros2.yml's dev job, which excludes 'rpi_os'.
  # For the publishing, it publishes only to
  # repo.droneleaf.io (see deploy-dev).
  # apt.droneleaf.io has no "-dev" channel.
  # ========================================================================================

  build-dev:
    if: contains(github.event.release.name, 'ros2') && contains(github.event.release.name, 'rpi_os') && contains(github.ref_name, 'dev')
    runs-on: Linux_ARM64_16core

    strategy:
      matrix:
        include:
          - target: RPI
            target_lower: rpi

    permissions:
      id-token: write
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Clone HEAR_Docker repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          rm -rf HEAR_Docker
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_Docker.git" HEAR_Docker \
            || { echo "❌ Failed to clone HEAR_Docker repository"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Login to GHCR (registry layer cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LEAF_FC ROS2 Jazzy for Debian trixie (dev)
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          triggering_actor: ${{ github.triggering_actor }}
          TOKEN: ${{ secrets.TOKEN }}
          target_lower: ${{ matrix.target_lower }}
          docker_builder: trixieBuilder_dev
          build_platform: linux/arm64
          CACHE_REF: ghcr.io/droneleaf/software-stack:leaf-fc-rpi-os-deps-cache
        run: |
          set -e
          export BUILD_TIMESTAMP=$(date +%s)

          if [[ "$FORCE_DEPS_REFRESH" == "true" ]]; then
            echo "Forcing fresh base, ros2, and deps stages; skipping GHCR cache import."
            BUILD_CACHE_ARGS=(--no-cache-filter base --no-cache-filter ros2 --no-cache-filter deps)
          else
            BUILD_CACHE_ARGS=(--cache-from "type=registry,ref=$CACHE_REF")
          fi

          docker buildx create --name "$docker_builder" --driver=docker-container --use \
            || docker buildx use "$docker_builder"

          EXPORT_DIR="${GITHUB_WORKSPACE}/upm_extracted_files_ros2_trixie_${target_lower}_dev/${WS_NAME}"

          docker buildx build . \
            --builder="$docker_builder" \
            --platform "$build_platform" \
            --file Dockerfile.unified \
            "${BUILD_CACHE_ARGS[@]}" \
            --target artifacts \
            --output "type=local,dest=$EXPORT_DIR" \
            --secret id=GITHUB_ID,env=triggering_actor \
            --secret id=GITHUB_TOKEN,env=TOKEN \
            --build-arg BASE_IMAGE="$TRIXIE_BASE_IMAGE" \
            --build-arg ROS2_APT_URL="" \
            --build-arg TARGET="${{ matrix.target }}" \
            --build-arg TARGET_RPI=ON \
            --build-arg USERNAME="${IMAGE_USERNAME}" \
            --build-arg WS_NAME="${WS_NAME}" \
            --build-arg IS_PRODUCTION="TRUE" \
            --build-arg COMPILE_BRANCH="${{ github.event.release.target_commitish || 'dev' }}" \
            --build-arg RANDOM_NUM="$BUILD_TIMESTAMP"

          docker buildx ls

      - name: Upload UPM workspace as artifact (dev)
        uses: actions/upload-artifact@v4
        with:
          name: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}_dev
          path: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}_dev
          if-no-files-found: error
          # Kept for 1 day only: the deploy job downloads it minutes later, and the build output should not stay downloadable.
          retention-days: 1
          # A re-run of a failed job uploads this name again, so replace it instead of failing.
          overwrite: true

      - name: Refresh dependency cache after forced dev build
        if: env.FORCE_DEPS_REFRESH == 'true'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          docker_builder: trixieBuilder_dev
          build_platform: linux/arm64
          CACHE_REF: ghcr.io/droneleaf/software-stack:leaf-fc-rpi-os-deps-cache
        run: |
          set -e
          docker buildx build . \
            --builder="$docker_builder" \
            --platform "$build_platform" \
            --file Dockerfile.unified \
            --target deps \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --build-arg BASE_IMAGE="$TRIXIE_BASE_IMAGE" \
            --build-arg ROS2_APT_URL="" \
            --build-arg USERNAME="$IMAGE_USERNAME"

  deploy-dev:
    needs: [build-dev]
    if: contains(github.event.release.name, 'ros2') && contains(github.event.release.name, 'rpi_os') && contains(github.ref_name, 'dev')
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - target: RPI
            target_lower: rpi
            target_upm_package_name: leaf_fc_ros2_trixie
            target_upm_publish_name: leaf-fc-ros2
            target_upm_profile: rpi_release
            target_upm_profile_upper: RPI-Release
            REPO_NAME: HEAR_FC

    permissions:
      id-token: write
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cancel competing leaf_fc_ros2.yml dev run (trixie dev takes priority)
        # Special case: it possible in some cases ti fire off the build-dev/deploy-dev
        # of both workflows Ubuntu's one and Trixie's one and since they share the same
        # package name "leaf-fc-ros2-dev" the dev releases should intentionally decided
        # whether to stage the Ubuntu version of Trixie version, so if both triggered at
        # the same time due to release/tag conditions met, we will give trixie dev build
        # the priority and cancel the run of Ubuntu's dev using gh cli.
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -e
          echo "Checking for a competing 'LEAF_FC ROS2 (Jazzy) Build and Deploy' run on commit ${{ github.sha }}..."
          sleep 15  # give the sibling workflow time to register its run
          COMPETING_RUN_ID=$(gh run list --repo "${{ github.repository }}" \
            --workflow "LEAF_FC ROS2 (Jazzy) Build and Deploy" \
            --event release \
            --json databaseId,headSha,status \
            --jq '.[] | select(.headSha=="${{ github.sha }}" and (.status=="queued" or .status=="in_progress")) | .databaseId' \
            | head -1)

          if [ -n "$COMPETING_RUN_ID" ]; then
            echo "::warning::Release '${{ github.event.release.name }}' (tag ${{ github.ref_name }}) matched both dev conditions — cancelling competing leaf_fc_ros2.yml run $COMPETING_RUN_ID to give this trixie dev build priority."
            gh run cancel "$COMPETING_RUN_ID" --repo "${{ github.repository }}" \
              || echo "::warning::Could not cancel run $COMPETING_RUN_ID — it may already have finished."
          else
            echo "No competing leaf_fc_ros2.yml run found for this commit."
          fi

      - name: Set VERSION to 0.0.0
        run: echo "VERSION=0.0.0" >> "$GITHUB_ENV"

      - name: Download the UPM workspace artifact (dev)
        uses: actions/download-artifact@v4
        with:
          name: upm_extracted_files_ros2_trixie_${{ matrix.target_lower }}_dev
          path: ./artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloads
        run: |
          test -d ./artifacts || { echo "::error::no artifacts downloaded"; exit 1; }
          ls -la ./artifacts/

          # UPM does not fail on missing files, it would publish a package without them.
          WORKSPACE_DIR="./artifacts/${WS_NAME}/${WS_NAME}"
          for binary in px4_mav_opti_flight_controller_onboard_mission betaflight_racer; do
            if ! ls "$WORKSPACE_DIR"/install/*/lib/flight_controller/"$binary"; then
              echo "::error::$binary is missing from the downloaded workspace"
              exit 1
            fi
          done
          if ! ls "$WORKSPACE_DIR"/install/*/share/flight_controller/launch/launch/*.py; then
            echo "::error::launch files are missing from the downloaded workspace"
            exit 1
          fi
          if ! ls "$WORKSPACE_DIR"/src/HEAR_FC/Flight_controller/*.xml; then
            echo "::error::XML files are missing from the downloaded workspace"
            exit 1
          fi

      - name: Setup GPG for package signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gnupg2
          fi
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret not found"; exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2 | head -1)
          echo -e "5\ny\n" | gpg --batch --command-fd 0 --expert --edit-key "$GPG_KEY_ID" trust
          git config --global user.signingkey "$GPG_KEY_ID"
          git config --global commit.gpgsign false
          echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --armor --detach-sig --sign >/dev/null
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$HOME/.gnupg" >> "$GITHUB_ENV"

      - name: Clone HEAR_Docker repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_Docker.git" HEAR_Docker \
            || { echo "❌ Failed to clone HEAR_Docker"; exit 1; }

      - name: Clone HEAR_CLI repository
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/HEAR_CLI.git" HEAR_CLI \
            || { echo "❌ Failed to clone HEAR_CLI"; exit 1; }

      - name: UPM package + repack -dev + deploy (repo.droneleaf.io only)
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPO_NAME: ${{ matrix.REPO_NAME }}
          registry_username: ${{ secrets.registry_username }}
          registry_password: ${{ secrets.registry_password }}
        run: |
          set -e
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DroneLeaf/UPM.git" UPM \
            || { echo "❌ Failed to clone UPM"; exit 1; }
          cd UPM
          [ -f upm.yaml ] || { echo "::error::upm.yaml not found"; exit 1; }

          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          PKG="${{ matrix.target_upm_package_name }}"
          if [ "$(yq eval ".packages.${PKG} // \"null\"" upm.yaml)" = "null" ]; then
            echo "::error::upm.yaml has no '${PKG}' (see define_trixie.md)."
            exit 1
          fi

          WORKSPACE_PATH="/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/artifacts/$REPO_NAME/$REPO_NAME"
          [ -d "$WORKSPACE_PATH" ] || {
            echo "::error::Workspace not found: $WORKSPACE_PATH"
            ls -la "$(dirname "$WORKSPACE_PATH")" || true
            exit 1
          }

          cp upm.yaml upm.yaml.backup
          yq eval ".packages.${PKG}.build.workspace = \"$WORKSPACE_PATH\"" -i upm.yaml
          yq eval ".packages.${PKG}.version = \"$VERSION\"" -i upm.yaml
          if [ "$(yq eval ".packages.${PKG}.build.workspace" upm.yaml)" != "$WORKSPACE_PATH" ]; then
            echo "::error::upm.yaml workspace update failed"; mv upm.yaml.backup upm.yaml; exit 1
          fi

          sed -i "s|/home/medo/projects/HEAR_CLI|/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/HEAR_CLI|g" upm.yaml
          sed -i "s|/home/medo/HEAR_Docker|/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/HEAR_Docker|g" upm.yaml

          cd upm && pip install -r requirements.txt && cd ..

          GPG_TTY=$(tty) ./upm_cli package "$PKG" ${{ matrix.target_upm_profile }} deb

          STEM=$(yq eval ".packages.${PKG}.packaging.name_template" upm.yaml | sed 's/-\?{version}.*//')
          ORIGINAL_DEB="dist/${STEM}-${VERSION}-${{ matrix.target_upm_profile_upper }}.deb"
          if [ ! -f "$ORIGINAL_DEB" ]; then
            echo "::error::${ORIGINAL_DEB} not found after packaging. Present:"; ls -la dist/ || true; exit 1
          fi

          # Repack as -dev — same convention as leaf_fc_ros2.yml's dev job: distinct
          # package identity (leaf-fc-ros2-dev) with Provides/Conflicts against the
          # stable leaf-fc-ros2 package so the two can't be installed side by side.
          target_upm_publish_name="${{ matrix.target_upm_publish_name }}"
          REPACK_DIR="repack_dev"
          DEV_DEB_NAME="${target_upm_publish_name}-dev-${VERSION}-${{ matrix.target_upm_profile_upper }}.deb"
          DEV_DEB="dist/${DEV_DEB_NAME}"

          mkdir -p "$REPACK_DIR"
          dpkg-deb -R "$ORIGINAL_DEB" "$REPACK_DIR"

          sed -i "s|^Package:.*|Package: ${target_upm_publish_name}-dev|" "$REPACK_DIR/DEBIAN/control"
          sed -i "s|^Version:.*|Version: ${VERSION}|" "$REPACK_DIR/DEBIAN/control"
          sed -i "s|^Description:.*|Description: TRIXIE DEV BUILD - tag: ${{ github.ref_name }} \| commit: ${{ github.sha }}|" "$REPACK_DIR/DEBIAN/control"

          if grep -q "^Provides:" "$REPACK_DIR/DEBIAN/control"; then
            sed -i "s|^Provides:.*|Provides: ${target_upm_publish_name}|" "$REPACK_DIR/DEBIAN/control"
          else
            echo "Provides: ${target_upm_publish_name}" >> "$REPACK_DIR/DEBIAN/control"
          fi
          if grep -q "^Conflicts:" "$REPACK_DIR/DEBIAN/control"; then
            sed -i "s|^Conflicts:.*|Conflicts: ${target_upm_publish_name}|" "$REPACK_DIR/DEBIAN/control"
          else
            echo "Conflicts: ${target_upm_publish_name}" >> "$REPACK_DIR/DEBIAN/control"
          fi

          if [ -f "$REPACK_DIR/DEBIAN/postinst" ]; then
            sed -i "s|${target_upm_publish_name}\.home_manifest|${target_upm_publish_name}-dev.home_manifest|g" "$REPACK_DIR/DEBIAN/postinst"
          fi

          dpkg-deb -Zzstd -z9 --build "$REPACK_DIR" "$DEV_DEB"
          echo "✅ Repacked: $DEV_DEB"

          PACKAGE_ABSOLUTE_PATH=$(find "$(pwd)" -name "$DEV_DEB_NAME" | head -1)
          test -n "$PACKAGE_ABSOLUTE_PATH" || { echo "::error::built -dev .deb not found"; exit 1; }
          echo "DEB_PATH=$PACKAGE_ABSOLUTE_PATH" >> "$GITHUB_ENV"

          # repo.droneleaf.io ONLY — no apt.droneleaf.io push for trixie dev builds.
          # Dev builds are throwaway test artifacts; apt.droneleaf.io has no "-dev"
          # channel, and the stable trixie suite there shouldn't see them.
          echo -e "\n\nDeploying trixie dev package: $PACKAGE_ABSOLUTE_PATH to repo.droneleaf.io...\n\n"
          # --fail-with-body: an HTTP error (401, 403, 500) must fail the step.
          # No -v: it would print the Authorization header into the public log.
          curl --fail-with-body -sS --connect-timeout 30 --max-time 1800 \
            -u "${registry_username}:${registry_password}" \
            -H "Content-Type: multipart/form-data" \
            --data-binary "@${PACKAGE_ABSOLUTE_PATH}" \
            http://18.158.175.125:80/repository/apt-trixie/ -H "Host: repo.droneleaf.io"

      - name: Upload the -dev .deb as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf_fc_rpi_os_${{ matrix.target_lower }}_dev_deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error
          # Kept for 1 day only: the package is published to apt anyway.
          retention-days: 1
          # A re-run of a failed job uploads this name again, so replace it instead of failing.
          overwrite: true

  cleanup-dev-release:
    needs: [deploy-dev]
    if: contains(github.event.release.name, 'ros2') && contains(github.event.release.name, 'rpi_os') && contains(github.ref_name, 'dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # This workflow can finish before its siblings. If the release is deleted while
      # they still attach assets to it, they create the tag again on main.
      - name: Wait for the other workflows of this release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          # 120 checks, 30 seconds apart: wait up to 1 hour.
          for attempt in $(seq 1 120); do
            UNFINISHED=$(gh run list --repo "$REPO" --branch "$TAG_NAME" --event release --limit 100 \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId')
            OTHERS=$(echo "$UNFINISHED" | grep -vx "$THIS_RUN" || true)
            if [ -z "$OTHERS" ]; then
              echo "No other workflow is using this release"
              exit 0
            fi
            echo "Check $attempt: waiting for runs" $OTHERS
            sleep 30
          done
          echo "::error::Other workflows still use $TAG_NAME, not deleting the release"
          exit 1

      - name: Delete dev release and tag so the name can be reused
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "🧹 Cleaning up trixie dev release/tag '${{ github.event.release.tag_name }}' now that the package deployed successfully"
          gh release delete "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes

