name: Flight Controllers Release Dispatcher

# Central entry point for flight-controller firmware builds (px4/betaflight).
# Those workflows are kept as reusable (workflow_call) workflows so they don't
# clutter the Actions tab with their own release-triggered runs; this dispatcher
# is the only one that reacts to `release: created` events, routing to each
# build based on which pattern the release title matches.

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'px4') || contains(github.event.release.name, 'betaflight')
    steps:
      - name: Release matches a flight-controller pattern
        run: echo "Triggering matching flight-controller builds"

  px4:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'px4')
    uses: ./.github/workflows/px4_build.yml
    secrets: inherit
    with:
      release_tag: ${{ github.event.release.tag_name }}
      release_name: ${{ github.event.release.name }}

  betaflight:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.name, 'betaflight')
    uses: ./.github/workflows/betaflight_build.yml
    secrets: inherit
    with:
      release_tag: ${{ github.event.release.tag_name }}
      release_name: ${{ github.event.release.name }}
